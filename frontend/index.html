<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayasan Customer Web Portal</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 480px;
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.75rem; }
    p { color: #64748b; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ayasan Customer Portal</h1>
    <p>This service container is deployed and running under Caddy reverse proxy.</p>
    <div class="badge">Deployment Ready (2026)</div>
  </div>
</body>
</html>
