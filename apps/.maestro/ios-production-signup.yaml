appId: com.akaiunsan.customer

---
# Production registration smoke. Use a fresh disposable account at runtime.
# The address picker is part of the required registration contract.
- clearState
- launchApp
- tapOn:
    text: "Allow Once"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "EN"
    optional: true
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- repeat:
    times: 3
    commands:
      - swipe:
          direction: UP
          duration: 400
- tapOn:
    id: "login-signup-button"
- extendedWaitUntil:
    visible:
      id: "signup-firstname-input"
    timeout: 10000
- assertVisible:
    id: "signup-lastname-input"
- assertVisible:
    id: "signup-phone-input"
- assertVisible:
    id: "signup-address-button"
- assertVisible:
    id: "signup-email-input"
- assertVisible:
    id: "signup-password-input"
- assertVisible:
    id: "signup-confirm-password-input"
- tapOn:
    id: "signup-firstname-input"
- inputText: "Maestro"
- tapOn:
    id: "signup-lastname-input"
- inputText: "Production"
- tapOn:
    id: "signup-phone-input"
- inputText: "0900000000"
- tapOn:
    id: "signup-email-input"
- inputText: ${MAESTRO_SIGNUP_EMAIL}
- tapOn:
    id: "signup-password-input"
- inputText: ${MAESTRO_SIGNUP_PASSWORD}
- tapOn:
    id: "signup-address-button"
- extendedWaitUntil:
    visible: "Bangkok.*"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "signup-next-button"
    timeout: 10000
- tapOn:
    id: "signup-next-button"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 30000
