# ==============================================================================
# Master Docker Compose — Production Stack (2026)
# ==============================================================================
# Services:
#   - caddy: Reverse proxy with automatic Let's Encrypt / ZeroSSL TLS & HTTP/3
#   - backend: Express 5 + TypeScript API (Akaiunsan Admin / Customer API)
#   - frontend: Customer Web Portal
#   - admin: Back-Office Management Dashboard
#   - postgres: Production Database (internal network only)
# ==============================================================================

networks:
  ingress_net:
    driver: bridge
  db_net:
    driver: bridge

volumes:
  postgres_data:
    name: akaiunsan_postgres_data
  backend_uploads:
    name: akaiunsan_backend_uploads
  backend_exports:
    name: akaiunsan_backend_exports
  caddy_data:
    name: akaiunsan_caddy_data
  caddy_config:
    name: akaiunsan_caddy_config

services:
  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy (Ingress & SSL)
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: akaiunsan_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress_net
    depends_on:
      - backend
      - frontend
      - admin
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Backend API (Node 22 / Express 5 / PostgreSQL)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${IMAGE_BACKEND:-akaiunsan-backend:latest}
    container_name: akaiunsan_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
    networks:
      - ingress_net
      - db_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Frontend Service (Customer Portal)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${IMAGE_FRONTEND:-akaiunsan-frontend:latest}
    container_name: akaiunsan_frontend
    restart: unless-stopped
    networks:
      - ingress_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Admin Service (Back-Office Portal)
  # ----------------------------------------------------------------------------
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        # Inlined into the SPA bundle at build time (see admin/src/lib/api.ts)
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://akai-api.cjs.vn}
        VITE_APP_KEY: ${APP_KEY:-}
    image: ${IMAGE_ADMIN:-akaiunsan-admin:latest}
    container_name: akaiunsan_admin
    restart: unless-stopped
    networks:
      - ingress_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    # PostGIS build of PG 16 — same PGDATA layout as postgres:16-alpine; ships
    # the postgis extension used by migration 003
    image: postgis/postgis:16-alpine
    container_name: akaiunsan_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-akaiunsan_db_prod}
      POSTGRES_USER: ${DB_USER:-akaiunsan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-akaiunsan} -d ${DB_NAME:-akaiunsan_db_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
