name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Run Backend Vitest Suite & Build Checks
  # ----------------------------------------------------------------------------
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: akaiunsan_db_test
          POSTGRES_USER: akaiunsan_test
          POSTGRES_PASSWORD: akaiunsan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U akaiunsan_test -d akaiunsan_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: ./backend
        run: npm run typecheck || true # tracked strictness ramp

      - name: Run Backend Test Suite (vitest + migrations)
        working-directory: ./backend
        env:
          NODE_ENV: test
        run: npx vitest run

      - name: Verify Dockerfile exists for image build
        run: test -f backend/Dockerfile

  # ----------------------------------------------------------------------------
  # Stage 2: Build & Push Multi-Stage Docker Images to GitHub Container Registry
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/runlumi/akaiunsan-backend:latest
            ghcr.io/runlumi/akaiunsan-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/runlumi/akaiunsan-frontend:latest
            ghcr.io/runlumi/akaiunsan-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Admin Image
      - name: Build and Push Admin Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: |
            ghcr.io/runlumi/akaiunsan-admin:latest
            ghcr.io/runlumi/akaiunsan-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PR-time image build validation (no push) — mirrors deploy.yml's backend image
  backend-image-build:
    name: Backend Docker Build
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: akaiunsan-backend:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Stage 3: SSH into VPS and Trigger Zero-Downtime Compose Update
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Trigger Remote VPS Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/akaiunsan
            ./deploy/scripts/auto-deploy.sh --force
            echo "Deployment successfully completed!"
