<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Akaiunsan Admin</title>
    <meta name="title" content="Akaiunsan Admin" />
    <meta
      name="description"
      content="Akaiunsan back-office dashboard — manage services, requests, banners, and supporters."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://akai-admin.cjs.vn" />
    <meta property="og:title" content="Akaiunsan Admin" />
    <meta
      property="og:description"
      content="Akaiunsan back-office dashboard — manage services, requests, banners, and supporters."
    />
    <meta
      property="og:image"
      content="https://akai-admin.cjs.vn/images/og.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://akai-admin.cjs.vn" />
    <meta name="twitter:title" content="Akaiunsan Admin" />
    <meta
      name="twitter:description"
      content="Akaiunsan back-office dashboard — manage services, requests, banners, and supporters."
    />
    <meta
      name="twitter:image"
      content="https://akai-admin.cjs.vn/images/og.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#f9f8f3" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
