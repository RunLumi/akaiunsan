baseURL = "https://streamentry.github.io/akaiunsan/"
defaultContentLanguage = "vi"
title = "AKAIUNSAN — Tài liệu nghiệp vụ"
theme = "hugo-book"

# Served on GitHub Pages
enableGitInfo = false
disablePathToLower = true
canonifyURLs = false

[params]
  # (Book) Theme config — branding theo DESIGN.md "Living Standard"
  BookTheme = "light"
  BookToC = true
  BookLogo = "logo.svg"
  BookSection = "docs"
  BookRepo = "https://github.com/streamentry/akaiunsan"
  BookEditPath = "edit/main"
  BookSearch = true
  BookComments = false
  BookPortableLinks = true
  BookServiceWorker = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "tango"
    lineNos = false

[languages]
  [languages.vi]
    locale = "vi-VN"
    label = "Tiếng Việt"
    weight = 1
