appId: com.akaiunsan.customer

---
# iOS-only extended smoke lane. It intentionally uses one explicit simulator
# and a disposable local account. It visits the documented user-visible routes
# without submitting a booking, charging a card, or deleting an account.
- clearState
- launchApp
- tapOn:
    text: "Allow Once"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "EN"
    optional: true
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "Sign In"
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 500
- extendedWaitUntil:
    visible:
      text: "Home.*"
    timeout: 30000

# Main tab shell.
- assertVisible:
    text: "Home.*"
- assertVisible:
    text: "Booking.*"
- assertVisible:
    text: "Inbox.*"
- assertVisible:
    text: "Account.*"

# AllService -> Service -> Address -> Option -> Payment wizard screens.
- tapOn:
    id: "all-services-button"
- extendedWaitUntil:
    visible: "Maid Service"
    timeout: 15000
- assertVisible: "Dịch vụ|Maid Service"
- tapOn: "Maid Service"
- extendedWaitUntil:
    visible: "Please pick the service date from above calendar"
    timeout: 15000
- tapOn:
    id: "service-date-${MAESTRO_SERVICE_DATE}"
- waitForAnimationToEnd
- tapOn:
    id: "service-next-button"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Maestro test address.*"
    timeout: 10000
- tapOn: "Maestro test address.*"
- swipe:
    direction: UP
    duration: 500
- tapOn:
    id: "service-next-button"
- extendedWaitUntil:
    visible: "Option"
    timeout: 10000
- assertVisible: "Specific helper.*|Select your helper.*"
- tapOn:
    id: "service-next-button"
- extendedWaitUntil:
    visible: "Payment"
    timeout: 10000
- assertVisible: "Payment method"
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "service-back-button"

# Booking list, calendar, upcoming detail, edit/reorder, and history detail.
- tapOn:
    text: "Booking.*"
- extendedWaitUntil:
    visible: "Booking.*"
    timeout: 15000
- tapOn:
    id: "booking-calendar-button"
- extendedWaitUntil:
    visible: "September 2026"
    timeout: 10000
- assertVisible: "MAID SERVICE"
- tapOn: "navigation-back-button"
- extendedWaitUntil:
    visible:
      id: "booking-item-maestro-booking-1"
    timeout: 10000
- tapOn:
    id: "booking-item-maestro-booking-1"
- extendedWaitUntil:
    visible: "Booking detail"
    timeout: 10000
- assertVisible: "Your helper"
- tapOn:
    id: "booking-edit-button"
- extendedWaitUntil:
    visible: "Service"
    timeout: 10000
- assertVisible: "Address"
- tapOn:
    id: "edit-reorder-back-button"
- tapOn: "History"
- tapOn:
    id: "history-item-maestro-booking-1"
- extendedWaitUntil:
    visible: "Detail history"
    timeout: 10000
- assertVisible: "Your helper"
- tapOn: "navigation-back-button"

# Inbox notification -> order detail -> Petcare payment screen.
- tapOn:
    text: "Inbox.*"
- extendedWaitUntil:
    visible:
      id: "inbox-notification-maestro-order-notification"
    timeout: 10000
- tapOn:
    id: "inbox-notification-maestro-order-notification"
- extendedWaitUntil:
    visible: "Pet profile:"
    timeout: 10000
- assertVisible: "Confirm"
- tapOn: "Confirm"
- extendedWaitUntil:
    visible: "Payment method"
    timeout: 10000
- assertVisible: "Select card|Next"
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

# Inbox promotion -> Promotion detail.
- tapOn:
    text: "Promotion"
- extendedWaitUntil:
    visible:
      id: "inbox-promotion-maestro-promotion-notification"
    timeout: 10000
- tapOn:
    id: "inbox-promotion-maestro-promotion-notification"
- extendedWaitUntil:
    visible: "Detail Promotion"
    timeout: 10000
- assertVisible: "Maestro promotion"
- tapOn: "navigation-back-button"

# Account menu and utility routes.
- tapOn:
    text: "Account.*"
- extendedWaitUntil:
    visible:
      id: "account-item-my-booking"
    timeout: 10000
- tapOn:
    id: "account-item-my-booking"
- extendedWaitUntil:
    visible:
      id: "my-booking-item-maestro-booking-1"
    timeout: 10000
- tapOn:
    id: "my-booking-item-maestro-booking-1"
- extendedWaitUntil:
    visible: "Booking detail"
    timeout: 10000
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-favourite"
- extendedWaitUntil:
    visible: "Favourite.*"
    timeout: 10000
- tapOn:
    id: "favourite-service-menu"
- extendedWaitUntil:
    visible: "Dịch vụ yêu thích|Favourite service$"
    timeout: 10000
- tapOn: "navigation-back-button"
- waitForAnimationToEnd
- tapOn:
    id: "favourite-provider-menu"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Nhà cung cấp yêu thích|Favourite service providers"
    timeout: 10000
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-promotions"
- extendedWaitUntil:
    visible:
      id: "promotion-list-title"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "promotion-item-maestro-promotion"
    timeout: 30000
- tapOn:
    id: "promotion-item-maestro-promotion"
- extendedWaitUntil:
    visible: "Detail Promotion"
    timeout: 10000
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-payment"
- extendedWaitUntil:
    visible: "PAYMENT"
    timeout: 10000
- assertVisible: "Data empty"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-history"
- extendedWaitUntil:
    visible: "HISTORY"
    timeout: 10000
- tapOn:
    id: "history-item-maestro-booking-1"
- extendedWaitUntil:
    visible: "Detail history"
    timeout: 10000
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-address"
- extendedWaitUntil:
    visible: "Maestro test address.*"
    timeout: 10000
- tapOn: "navigation-back-button"

- tapOn: "Edit profile"
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 10000
- tapOn:
    id: "edit-profile-address-button"
- extendedWaitUntil:
    visible: "Search address|Pick Location"
    timeout: 15000
- tapOn: "navigation-back-button"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-friend-share"
- extendedWaitUntil:
    visible:
      id: "referral-code"
    timeout: 15000
- assertVisible: "Ref code: MAESTRO"
- tapOn: "navigation-back-button"

- tapOn:
    id: "account-item-about-us"
- extendedWaitUntil:
    visible: "Privacy Policy"
    timeout: 10000
- assertVisible: "Term of Use"
# The buttons are covered here; the linked legal pages are hosted by the
# separately deployed customer web portal and are not part of this app lane.
- tapOn: "navigation-back-button"

# Logout is the final state; do not remove the disposable account.
- tapOn:
    text: ".*Log out"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
