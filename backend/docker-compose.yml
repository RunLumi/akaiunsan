version: "3"

services:  
  mariadb:
    container_name: dev-api.akaiunsan.vn-db
    image: "mariadb:10.9.6"
    restart: "unless-stopped"
    ports:
      - "15506:3306"
    volumes:
      - "/home/dev-api.akaiunsan.vn-db/mysql/data:/var/lib/mysql"
      - "/home/dev-api.akaiunsan.vn-db/mysql/logs:/var/lib/mysql/logs"
      - /home/dev-api.akaiunsan.vn-db/mariadb-conf:/etc/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Nichietsuvn@123"
      MYSQL_DATABASE: "akaiunsan_db_dev"
      MYSQL_USER: "akaiunsan_db_dev"
      MYSQL_PASSWORD: "akaiunsan_db_dev"
    deploy:
        resources:
            limits:
              cpus: "1"
              memory: 2048M
            reservations:
              cpus: "0.5"
              memory: 512M
networks:
  default:
    name: dev-api.akaiunsan.vn-db_default
