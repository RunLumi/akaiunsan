appId: com.akaiunsan.customer

---
# Requires a staging/UAT account supplied at runtime:
# MAESTRO_EMAIL=... MAESTRO_PASSWORD=... maestro test ...
- clearState
- launchApp
- tapOn:
    text: "Allow Once"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "EN"
    optional: true
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "Sign In"
- repeat:
    times: 10
    commands:
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 500
- extendedWaitUntil:
    visible:
      text: "Home.*"
    timeout: 30000

# FR-HOME-01 / FR-SVC-01: home and service discovery.
- assertVisible:
    text: "Home.*"
- assertVisible:
    text: "Booking.*"
- assertVisible:
    text: "Inbox.*"
- assertVisible:
    text: "Account.*"
- assertVisible: "Maid Service"
- tapOn: "Maid Service"
- extendedWaitUntil:
    visible: "Please pick the service date from above calendar"
    timeout: 15000
- assertVisible: "Service"
- assertVisible: "Address"
- assertVisible: "Option"
- assertVisible: "Payment"
- tapOn: "12"
- extendedWaitUntil:
    visible: "How many Hour(s)"
    timeout: 10000
- assertVisible: "How many Hour(s)"
- assertVisible: "Start time"
- assertVisible:
    id: "service-next-button"
- tapOn:
    text: "service-back-button"

# FR-BOOK-05 and FR-BOOK-01: booking list and calendar entry point.
- tapOn:
    text: "Booking.*"
- extendedWaitUntil:
    visible:
      text: "Booking.*"
    timeout: 15000
- assertVisible: "Upcoming"
- assertVisible: "History"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Upcoming"

# FR-NOTI-01..03: both inbox tabs and empty/data state.
- tapOn:
    text: "Inbox.*"
- extendedWaitUntil:
    visible:
      text: "Inbox.*"
    timeout: 15000
- assertVisible: "Notification"
- assertVisible: "Promotion"
- tapOn: "Promotion"
- assertVisible: "Promotion"
- tapOn: "Notification"

# FR-PRO-01 / FR-PAY-01 / FR-FAV-01 / FR-HIST-01 / FR-SUB-01.
- tapOn:
    text: "Account.*"
- extendedWaitUntil:
    visible:
      text: "Account.*"
    timeout: 15000
- assertVisible:
    text: "MY BOOKING.*"
- assertVisible:
    text: "FAVOURITE.*"
- assertVisible:
    text: "PROMOTIONS.*"
- assertVisible:
    text: "PAYMENT.*"
- assertVisible:
    text: "HISTORY.*"
- assertVisible:
    text: "ADDRESS.*"
- assertVisible:
    text: "SUBSCRIPTION MENU.*"

- tapOn:
    text: "FAVOURITE.*"
- extendedWaitUntil:
    visible: "Favourite.*"
    timeout: 10000
- tapOn:
    text: "navigation-back-button"
- tapOn:
    text: "PAYMENT.*"
- extendedWaitUntil:
    visible: "PAYMENT"
    timeout: 10000
- tapOn:
    text: "navigation-back-button"
- tapOn:
    text: "HISTORY.*"
- extendedWaitUntil:
    visible: "HISTORY"
    timeout: 10000
- tapOn:
    text: "navigation-back-button"
- tapOn:
    text: "ADDRESS.*"
- extendedWaitUntil:
    visible: "ADDRESS"
    timeout: 10000
- tapOn:
    text: "navigation-back-button"
- tapOn:
    text: "SUBSCRIPTION MENU.*"
- extendedWaitUntil:
    visible: "Data empty"
    timeout: 10000
- assertVisible: "Data empty"
- tapOn:
    text: "navigation-back-button"
- tapOn:
    text: "PROMOTIONS.*"
- extendedWaitUntil:
    visible: "Promotion.*"
    timeout: 10000
- tapOn:
    text: "navigation-back-button"

# FR-ACC-05: logout returns to the authentication boundary.
- tapOn:
    text: ".*Log out"
- tapOn:
    text: "OK"
    optional: true
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 15000
